<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game — Hotdog Party</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  body { background:#141414; }

  .player-wrap {
    position:relative; z-index:5;
    max-width:1560px; margin:0 auto;
    padding:5.2rem clamp(.8rem,2vw,1.6rem) 2.5rem;
    display:grid; gap:1.2rem;
    grid-template-columns:minmax(0,1fr) 300px;
    align-items:start;
  }
  @media (max-width:1080px){ .player-wrap { grid-template-columns:minmax(0,1fr); } }

  .player {
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    background:#1b1b1b; box-shadow:0 26px 70px rgba(0,0,0,.55);
  }

  .bar {
    display:flex; align-items:center; gap:.7rem;
    padding:.7rem .8rem; background:#202020; border-bottom:1px solid var(--line);
  }
  .back {
    display:inline-flex; align-items:center; gap:.45rem;
    padding:.55rem 1rem; border-radius:11px;
    border:1px solid var(--line); background:#2a2a2a; color:var(--text);
    font-size:.82rem; font-weight:700; text-decoration:none; white-space:nowrap;
    transition:background .2s, border-color .2s;
  }
  .back:hover { background:#333; border-color:color-mix(in srgb, var(--accent) 50%, transparent); }

  .bar-title { display:flex; align-items:center; gap:.6rem; min-width:0; }
  .bar-title .thumb {
    width:34px; height:34px; flex:none; border-radius:9px;
    border:1px solid color-mix(in srgb, var(--accent) 34%, transparent);
  }
  .bar-name {
    font-size:.9rem; font-weight:700; color:var(--accent);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .bar-right { margin-left:auto; display:flex; align-items:center; gap:.5rem; }

  .timer {
    display:inline-flex; align-items:center; gap:.6rem;
    padding:.5rem 1.05rem .5rem .6rem; border-radius:100px;
    border:1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    background:color-mix(in srgb, var(--accent) 15%, transparent);
    color:var(--accent-soft); font-size:.8rem; font-weight:700; white-space:nowrap;
  }
  .timer.done { border-color:rgba(76,175,80,.55); background:rgba(76,175,80,.14); color:#8fd694; }
  .ring { width:20px; height:20px; flex:none; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:3.2; }
  .ring .track { stroke:rgba(255,255,255,.16); }
  .ring .fill  { stroke:currentColor; stroke-linecap:round; transition:stroke-dashoffset .1s linear; }

  .icon-btn {
    display:grid; place-items:center; width:38px; height:38px; flex:none;
    border-radius:11px; border:1px solid var(--line); background:#2a2a2a;
    color:var(--muted); font-size:.95rem; cursor:pointer;
    transition:background .2s, color .2s, border-color .2s;
  }
  .icon-btn:hover { background:#333; color:var(--text); border-color:color-mix(in srgb, var(--accent) 50%, transparent); }
  .icon-btn.flag:hover { border-color:#e0483c; color:#ff7a70; }

  .surface { position:relative; background:#faf7f2; aspect-ratio:16/10; }
  @media (max-width:700px){ .surface { aspect-ratio:4/5; } }
  .surface iframe { width:100%; height:100%; border:0; display:block; }

  .placeholder {
    position:absolute; inset:0; background:#1b1b1b;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.9rem; text-align:center; padding:2rem;
  }
  .placeholder .big {
    font-size:clamp(1.2rem,3vw,1.9rem); font-weight:900;
    text-transform:uppercase; letter-spacing:.03em; color:var(--accent);
  }
  .placeholder p { color:var(--muted); font-weight:300; max-width:46ch; line-height:1.7; font-size:.88rem; }
  .placeholder code {
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.78rem;
    color:var(--accent-soft); background:rgba(255,255,255,.06);
    padding:.16em .45em; border-radius:6px;
  }
  .pulse-dot { width:10px; height:10px; border-radius:50%; background:var(--accent); animation:ring 2s infinite; }
  @keyframes ring {
    0%   { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70%  { box-shadow:0 0 0 22px transparent; }
    100% { box-shadow:0 0 0 0 transparent; }
  }

  .strip {
    display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1.5rem;
    padding:.9rem 1.1rem; background:#1b1b1b; border-top:1px solid var(--line);
    font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
  }
  .strip b { color:var(--muted); font-weight:400; }
  .strip .tagline { text-transform:none; letter-spacing:0; font-size:.85rem; color:var(--muted); font-weight:300; }

  /* ---------- quick play rail ---------- */
  .rail { position:sticky; top:5.2rem; }
  .rail h2 {
    display:flex; align-items:center; gap:.45rem;
    font-size:.8rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin-bottom:.85rem; padding-left:.15rem;
  }
  .rail-list { display:flex; flex-direction:column; gap:.5rem; }
  .rail-item {
    display:flex; align-items:center; gap:.8rem;
    padding:.5rem .7rem; border-radius:13px;
    border:1px solid var(--line); background:#1d1d1d;
    text-decoration:none; color:var(--text);
    transition:background .2s, border-color .2s, transform .2s;
  }
  .rail-item:hover { background:#252525; border-color:color-mix(in srgb, var(--accent) 45%, transparent); transform:translateX(3px); }
  .rail-item .thumb { width:44px; height:44px; flex:none; border-radius:10px; border:1px solid var(--line); }
  .rail-who { min-width:0; }
  .rail-name { display:block; font-size:.86rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rail-plays { display:block; font-size:.68rem; color:var(--dim); letter-spacing:.06em; margin-top:.1rem; }
  @media (max-width:1080px){ .rail { position:static; margin-top:.5rem; } }

  @media (max-width:760px){
    .bar { flex-wrap:wrap; }
    .bar-title { flex:1 1 auto; min-width:0; }
    .bar-right { width:100%; margin-left:0; justify-content:space-between; }
    .timer { flex:1; justify-content:center; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="vignette heavy"></div>

<nav class="nav">
  <a class="nav-logo" href="index.html">Hotdog Party</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="games.html" class="active">Games</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="player-wrap">

  <div class="player">
    <div class="bar">
      <a class="back" href="games.html">‹ Back</a>
      <div class="bar-title" id="bar-title"><span class="bar-name">Loading…</span></div>
      <div class="bar-right">
        <span class="timer" id="timer">
          <svg class="ring" viewBox="0 0 24 24">
            <circle class="track" cx="12" cy="12" r="9"></circle>
            <circle class="fill"  cx="12" cy="12" r="9" id="ring-fill"
                    stroke-dasharray="56.55" stroke-dashoffset="56.55"></circle>
          </svg>
          <span id="timer-label">Play for 10s</span>
        </span>
        <button class="icon-btn" id="btn-reload" title="Restart game" aria-label="Restart game">⟳</button>
        <button class="icon-btn flag" id="btn-report" title="Report a problem" aria-label="Report a problem">⚑</button>
        <button class="icon-btn" id="btn-full" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
    </div>

    <div class="surface" id="surface"></div>

    <div class="strip">
      <span class="tagline" id="g-tag"></span>
      <span style="margin-left:auto">Players <b id="m-players">1</b></span>
      <span>Controls <b>Keyboard / Mouse</b></span>
      <span>Plays <b id="m-plays">—</b></span>
    </div>
  </div>

  <aside class="rail">
    <h2>⚡ Quick Play</h2>
    <div class="rail-list" id="rail"></div>
  </aside>

</div>

<footer class="footer">
  <span>© <span id="yr"></span> Hotdog Party</span>
  <span><a href="index.html">Home</a> · <a href="games.html">Games</a> · <a href="contact.html">Contact</a></span>
</footer>

<script src="assets/gamedata.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/plays.bundle.js"></script>
<script src="assets/hotdog.bundle.js"></script>
<script>
(function () {
  document.getElementById('yr').textContent = new Date().getFullYear();

  var slug    = new URLSearchParams(location.search).get('g');
  var surface = document.getElementById('surface');
  var all = [], game = null;

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function shift(hex, pct) {
    var n = parseInt(hex.slice(1), 16);
    function f(c) { return Math.max(0, Math.min(255, Math.round(c + (pct/100) * (pct > 0 ? 255 - c : c)))); }
    return '#' + [f(n >> 16 & 255), f(n >> 8 & 255), f(n & 255)]
      .map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
  }

  function loadGame() {
    surface.innerHTML = game.url
      ? '<iframe src="' + esc(game.url) + '" title="' + esc(game.title) + '" allowfullscreen ' +
        'allow="autoplay; fullscreen; gamepad; clipboard-write"></iframe>'
      : '<div class="placeholder">' +
          '<div class="pulse-dot"></div>' +
          '<div class="big">No file linked</div>' +
          '<p>This game has no <code>path</code> set in <code>games.json</code>. ' +
             'Point it at the game\'s HTML file — for example ' +
             '<code>games/' + esc(game.slug) + '/index.html</code>.</p>' +
        '</div>';
  }

  function render(counts) {
    var by = {};
    (counts || []).forEach(function (c) { by[c.slug] = c.count; });
    document.getElementById('m-plays').textContent = (by[game.slug] || 0).toLocaleString();

    var others = all.filter(function (g) { return g.slug !== game.slug; });
    others.sort(function (a, b) { return (by[b.slug] || 0) - (by[a.slug] || 0); });

    document.getElementById('rail').innerHTML = others.slice(0, 8).map(function (g) {
      var n = by[g.slug] || 0;
      return '<a class="rail-item" href="game.html?g=' + encodeURIComponent(g.slug) + '">' +
               window.GameData.thumb(g) +
               '<span class="rail-who">' +
                 '<span class="rail-name">' + esc(g.title) + '</span>' +
                 '<span class="rail-plays">' + (n ? n.toLocaleString() + ' play' + (n === 1 ? '' : 's') : 'New') + '</span>' +
               '</span>' +
             '</a>';
    }).join('');
  }

  function refreshCount() { window.Plays.top(50).then(render, function () { render([]); }); }

  window.GameData.load().then(function (games) {
    all  = games;
    game = window.GameData.find(all, slug) || all[0];

    if (!game) {
      document.getElementById('bar-title').innerHTML = '<span class="bar-name">No games found</span>';
      surface.innerHTML = '<div class="placeholder"><div class="big">No games yet</div>' +
        '<p>Add a <code>games.json</code> to the site root and the player will pick it up.</p></div>';
      return;
    }

    if (game.accent) {
      var r = document.documentElement;
      r.style.setProperty('--accent', game.accent);
      r.style.setProperty('--accent-soft', shift(game.accent,  40));
      r.style.setProperty('--accent-deep', shift(game.accent, -28));
    }

    document.title = game.title + ' — Hotdog Party';
    document.getElementById('bar-title').innerHTML =
      window.GameData.thumb(game) + '<span class="bar-name">' + esc(game.title) + '</span>';
    document.getElementById('g-tag').textContent = game.tag || '';
    document.getElementById('m-players').textContent =
      (game.tags || []).indexOf('multiplayer') > -1 ? '2' : '1';

    loadGame();
    document.getElementById('btn-reload').onclick = loadGame;

    document.getElementById('btn-full').onclick = function () {
      var el = surface.querySelector('iframe') || surface;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen();
    };

    document.getElementById('btn-report').onclick = function () {
      location.href = 'mailto:hello@hotdogparty.example'
        + '?subject=' + encodeURIComponent('Problem with ' + game.title)
        + '&body='    + encodeURIComponent('What went wrong:\n\n\nGame: ' + game.title + ' (' + game.slug + ')');
    };

    /* ---- bank a play after 10 seconds on the page ---- */
    var CIRC  = 56.55;
    var fill  = document.getElementById('ring-fill');
    var pill  = document.getElementById('timer');
    var label = document.getElementById('timer-label');

    window.Plays.countPlayAfter(game.slug, game.title, 10, function (elapsed, total) {
      fill.setAttribute('stroke-dashoffset', String(CIRC * (1 - elapsed / total)));
      if (elapsed >= total) { pill.classList.add('done'); label.textContent = 'Play counted'; }
      else { label.textContent = 'Play for ' + Math.max(0, Math.ceil(total - elapsed)) + 's'; }
    }, refreshCount);

    refreshCount();

    window.mountHotdog({
      canvas: document.getElementById('bg-canvas'),
      accent: game.accent ? parseInt(game.accent.slice(1), 16) : 0xff8c1a,
      mode:   'ambient',
    });
  });
})();
</script>
</body>
</html>
